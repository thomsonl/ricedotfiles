include ~/.config/kitty/themes/transparent.conf

# Use fish in kitty only; login shell stays /usr/bin/bash
shell /usr/bin/fish

# Tab bar at the top of the window
tab_bar_edge top
tab_bar_min_tabs 1

# Plain straight-line separator tabs, neutral grayscale, no fill blocks
tab_bar_style separator
tab_separator " │ "
tab_title_template "{index}: {(('Claude: ' + tab.active_wd.rstrip('/').rsplit('/', 1)[-1]) if tab.active_wd.rstrip('/') != '/home/thomson' else (('Claude: ' + title) if title else 'Claude')) if tab.active_exe.lower() in ('claude', 'wl-copy', 'wl-paste', 'xclip', 'xsel') else tab.active_exe.capitalize()}"

active_tab_foreground   #e8e6e1
active_tab_background   #000000
active_tab_font_style   bold

inactive_tab_foreground #6b6b6b
inactive_tab_background #000000
inactive_tab_font_style normal

tab_bar_background      #000000
